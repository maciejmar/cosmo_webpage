name: CI/CD Angular via SSH

on:
  push:
    branches: ["dev_server"]
    paths:
      - "cosmopolish-app/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: ["dev_server"]
    paths:
      - "cosmopolish-app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  APP_DIR: cosmopolish-app
  BUILD_DIR: cosmopolish-app/dist/cosmopolish-app/browser
  SSH_PORT: 2222

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: cosmopolish-app/package-lock.json

      - name: Install deps
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Create .env
        working-directory: ${{ env.APP_DIR }}
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USERNAME_2: ${{ secrets.ADMIN_USERNAME_2 }}
          ADMIN_PASSWORD_2: ${{ secrets.ADMIN_PASSWORD_2 }}
        run: |
          if [ -z "$ADMIN_USERNAME" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Missing ADMIN_USERNAME or ADMIN_PASSWORD secret"
            exit 1
          fi

          {
            printf 'ADMIN_USERNAME=%s\n' "$ADMIN_USERNAME"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            if [ -n "$ADMIN_USERNAME_2" ] && [ -n "$ADMIN_PASSWORD_2" ]; then
              printf 'ADMIN_USERNAME_2=%s\n' "$ADMIN_USERNAME_2"
              printf 'ADMIN_PASSWORD_2=%s\n' "$ADMIN_PASSWORD_2"
            fi
          } > .env

      - name: Build Angular (prod)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  deploy:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist-upload

      - name: Prepare deploy archive
        run: |
          tar -czf web-dist.tgz -C dist-upload .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || env.SSH_PORT }}
          source: web-dist.tgz
          target: /tmp

      - name: Extract and publish on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || env.SSH_PORT }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR }}"
            RELEASE_DIR="/tmp/cosmopolish-release-$(date +%s)"

            mkdir -p "$TARGET_DIR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            tar -xzf /tmp/web-dist.tgz -C "$RELEASE_DIR"
            rm -f /tmp/web-dist.tgz

            find "$TARGET_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$RELEASE_DIR"/. "$TARGET_DIR"/
            rm -rf "$RELEASE_DIR"
